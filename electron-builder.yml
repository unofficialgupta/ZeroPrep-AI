appId: ai.zeroprep.app
productName: ZeroPrep AI
copyright: Copyright © 2026 ZeroPrep AI

directories:
  output: dist-electron
  buildResources: build/

# Files to include in the packaged app
files:
  - .next/standalone/**
  - .next/static/**
  - public/**
  - electron/dist/**
  - node_modules/electron-is-dev/**

# Extra resources copied next to the app binary
extraResources:
  - from: .next/static
    to: .next/static
  - from: public
    to: public

# ─────────────────── macOS ───────────────────
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  # Hardened Runtime required for Notarization (set to true when you have Apple Developer ID)
  hardenedRuntime: false
  # Entitlements grant OS permissions (mic, screen capture, audio)
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Deep-link protocol: zeroprep://auth/callback for Google OAuth
  protocols:
    - name: ZeroPrep Auth
      schemes: [zeroprep]

dmg:
  title: ZeroPrep AI ${version}
  sign: false

# ─────────────────── Windows ───────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  protocols:
    - name: ZeroPrep Auth
      schemes: [zeroprep]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ZeroPrep AI

# ─────────────────── Linux ───────────────────
linux:
  target: AppImage
  category: Utility
  protocols:
    - name: ZeroPrep Auth
      schemes: [zeroprep]

# ──────────────────── Auto-Updater & GitHub Releases ────────────────────
# Run: npm run dist:mac (or dist:win / dist:linux) to build and upload to Releases.
# Set the GH_TOKEN env var to a GitHub Personal Access Token with 'repo' scope.
# Example: GH_TOKEN=github_pat_xxx npm run dist:mac
publish:
  provider: github
  owner: unofficialgupta
  repo: ZeroPrep-AI
  releaseType: draft
